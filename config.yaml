    enabled: true
    url: "https://123milhas.com/v2/busca?de=CNF&para=SSA&adultos=2&criancas=0&bebes=0&ida=18-12-2026&volta=23-12-2026&classe=3&is_loyalty=0&search_id=2263245452"
    max_price_brl: 1600.00
    min_drop_percent: 3
