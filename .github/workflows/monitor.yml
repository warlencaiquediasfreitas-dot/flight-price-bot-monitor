name: Monitorar página

on:
  workflow_dispatch:
  schedule:
    # Monitoramento frequente: duas vezes por hora
    - cron: "17,47 * * * *"

    # Status de rotina: aproximadamente a cada 2 horas
    - cron: "23 */2 * * *"

permissions:
  contents: write

concurrency:
  group: flight-price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar navegador do Playwright
        run: python -m playwright install --with-deps chromium

      - name: Rodar robo uma vez
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m app.main --once

      - name: Enviar status de rotina no Telegram
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 */2 * * *'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import sqlite3
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          def brl(value):
              return f"R$ {value:,.2f}".replace(",", "X").replace(".", ",").replace("X", ".")

          db_path = "data/flight_prices.sqlite3"
          if not os.path.exists(db_path):
              print("Base de dados ainda não existe.")
              raise SystemExit(0)

          con = sqlite3.connect(db_path)
          con.row_factory = sqlite3.Row

          rows = con.execute("""
              SELECT monitor_name, checked_at, min_price_brl
              FROM price_checks
              WHERE id IN (
                  SELECT MAX(id)
                  FROM price_checks
                  GROUP BY monitor_name
              )
              ORDER BY monitor_name
          """).fetchall()

          if not rows:
              print("Sem consultas salvas para enviar status.")
              raise SystemExit(0)

          now_br = datetime.now(timezone.utc).astimezone().strftime("%d/%m/%Y %H:%M:%S")

          lines = [
              "✅ Status do robô de passagens",
              "",
              "O robô rodou agora e está funcionando.",
              f"Horário: {now_br}",
              "",
              "Últimos preços encontrados:"
          ]

          for row in rows:
              lines.append(f"- {row['monitor_name']}: {brl(float(row['min_price_brl']))}")

          lines.extend([
              "",
              "Observação: se aparecer preço menor ou mudança relevante, o robô também enviará alerta separado."
          ])

          text = "\n".join(lines)

          token = os.environ.get("TELEGRAM_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")

          if not token or not chat_id:
              print("Telegram não configurado nos Secrets.")
              raise SystemExit(0)

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text,
          }).encode("utf-8")

          try:
              req = urllib.request.Request(url, data=payload, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  response.read()
              print("Status enviado por Telegram.")
          except Exception as exc:
              print(f"Falha ao enviar status por Telegram: {type(exc).__name__}")
              raise SystemExit(1)
          PY

      - name: Salvar historico no repositorio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ screenshots/ || true
          git diff --cached --quiet || git commit -m "Atualiza historico de precos"
          git push || true
