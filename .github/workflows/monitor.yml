name: Monitorar página

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: flight-price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar navegador do Playwright
        run: python -m playwright install --with-deps chromium

      - name: Ativar filtro Total no Pix + Max 1 Parada + Chegada ate 18h no dia 31/12
        run: |
          python - <<'PY'
          import os

          os.makedirs("data", exist_ok=True)

          code = '''import re

          _orig_compile = re.compile
          _orig_findall = re.findall
          _orig_finditer = re.finditer

          _TAG_RE = _orig_compile(r"<[^>]+>")
          _PIX_ITER_RE = _orig_compile(
              r"Total\\s+no\\s+Pix[^R\\d]{0,40}R\\$\\s*(?:\\d{1,3}(?:\\.\\d{3})*(?:,\\d{2})?|\\d+(?:,\\d{2})?)",
              re.IGNORECASE
          )
          _VOLTA_SPLIT_RE = _orig_compile(
              r"\\bVolta\\b\\s*(?:Seg|Ter|Qua|Qui|Sex|S[áa]b|Dom|\\d{2}/\\d{2})",
              re.IGNORECASE
          )
          _TIME_RE = _orig_compile(r"(\\d{2}:\\d{2})(\\s*\\+\\s*\\d+)?")
          _STOPS_RE = _orig_compile(r"\\b(Direto|(\\d+)\\s*Paradas?)\\b", re.IGNORECASE)
          _INLINE_OPT_RE = _orig_compile(
              r"(\\d{2}:\\d{2})(?:(?!\\d{2}:\\d{2}).){1,140}?\\b(Direto|\\d+\\s*Paradas?)\\b(?:(?!\\d{2}:\\d{2}).){1,140}?(\\d{2}:\\d{2})(\\s*\\+\\s*\\d+)?",
              re.IGNORECASE | re.DOTALL
          )

          def _extract_options(section_text):
              opts = []
              parts = _orig_compile(r"\\bvoo\\b", re.IGNORECASE).split(section_text)
              if len(parts) > 1:
                  for chunk in parts[1:]:
                      chunk_short = chunk[:260]
                      times = _TIME_RE.findall(chunk_short)
                      sm = _STOPS_RE.search(chunk_short)
                      if len(times) >= 2 and sm:
                          dep_t = times[0][0]
                          arr_t, arr_plus = times[1][0], (times[1][1] or "").strip()
                          st_raw = sm.group(1).lower()
                          stops = 0 if "direto" in st_raw else int(sm.group(2))
                          opts.append((dep_t, stops, arr_t, arr_plus))
              if not opts:
                  for m in _INLINE_OPT_RE.finditer(section_text):
                      dep_t = m.group(1)
                      st_raw = m.group(2).lower()
                      stops = 0 if "direto" in st_raw else int(_orig_compile(r"\\d+").search(st_raw).group(0))
                      arr_t = m.group(3)
                      arr_plus = (m.group(4) or "").strip()
                      opts.append((dep_t, stops, arr_t, arr_plus))
              return opts

          def _has_valid_option(section_text, is_outbound_31_12):
              opts = _extract_options(section_text)
              if not opts:
                  return False
              for dep_t, stops, arr_t, arr_plus in opts:
                  if stops > 1:
                      continue
                  if is_outbound_31_12:
                      if arr_plus:
                          continue
                      hh, mm = map(int, arr_t.split(":"))
                      if (hh * 60 + mm) > (18 * 60):
                          continue
                  return True
              return False

          def _filter_total_pix(text):
              if not isinstance(text, str):
                  return text
              if "total no pix" not in text.lower():
                  return text
              clean = _TAG_RE.sub(" ", text)
              matches = list(_PIX_ITER_RE.finditer(clean))
              if not matches:
                  return ""

              header_text = clean[:matches[0].start()]
              page_is_31_12 = bool(_orig_compile(r"31/12/2026|31\\s+dez", re.IGNORECASE).search(header_text))

              valid_pix_strings = []
              for idx, m in enumerate(matches):
                  start = m.start()
                  end = matches[idx + 1].start() if (idx + 1) < len(matches) else min(len(clean), start + 4500)
                  card_text = clean[start:end]

                  v_split = _VOLTA_SPLIT_RE.search(card_text)
                  if v_split:
                      ida_sec = card_text[:v_split.start()]
                      volta_sec = card_text[v_split.start():]
                      is_31 = page_is_31_12 or bool(_orig_compile(r"31/12/2026|31\\s+dez", re.IGNORECASE).search(ida_sec[:180]))
                      if _has_valid_option(ida_sec, is_31) and _has_valid_option(volta_sec, False):
                          valid_pix_strings.append(m.group(0))
                  else:
                      is_31 = page_is_31_12 or bool(_orig_compile(r"31/12/2026|31\\s+dez", re.IGNORECASE).search(card_text[:180]))
                      if _has_valid_option(card_text, is_31):
                          valid_pix_strings.append(m.group(0))

              if valid_pix_strings:
                  return " | ".join(valid_pix_strings)
              return ""

          class _PatternProxy:
              def __init__(self, pat):
                  self._pat = pat
              def findall(self, string, *args, **kwargs):
                  return self._pat.findall(_filter_total_pix(string), *args, **kwargs)
              def finditer(self, string, *args, **kwargs):
                  return self._pat.finditer(_filter_total_pix(string), *args, **kwargs)
              def search(self, string, *args, **kwargs):
                  return self._pat.search(_filter_total_pix(string), *args, **kwargs)
              def __getattr__(self, name):
                  return getattr(self._pat, name)

          def _compile_proxy(pattern, flags=0):
              pat = _orig_compile(pattern, flags)
              pat_str = pattern if isinstance(pattern, str) else ""
              if "R$" in pat_str or "R\\$" in pat_str or "\\d" in pat_str:
                  return _PatternProxy(pat)
              return pat

          def _findall_proxy(pattern, string, flags=0):
              return _orig_findall(pattern, _filter_total_pix(string), flags)

          def _finditer_proxy(pattern, string, flags=0):
              return _orig_finditer(pattern, _filter_total_pix(string), flags)

          re.compile = _compile_proxy
          re.findall = _findall_proxy
          re.finditer = _finditer_proxy
          '''
          with open("sitecustomize.py", "w", encoding="utf-8") as f:
              f.write(code)
          print("Filtro Total no Pix + Max 1 Parada + Chegada ate 18h (31/12) ativado.")
          PY

      - name: Executar 3 baterias seguidas de pesquisa e envio no Telegram
        env:
          PYTHONPATH: "."
          SANDBOX_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          SANDBOX_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for CICLO in 1 2 3; do
            echo "=================================================="
            echo "Iniciando bateria $CICLO de 3..."
            echo "=================================================="

            # Limpa precos antigos antes da bateria para nunca reaproveitar voos com 2 paradas
            python - <<'PY'
          import os, sqlite3
          db_path = "data/flight_prices.sqlite3"
          if os.path.exists(db_path):
              con = sqlite3.connect(db_path)
              con.execute("DELETE FROM price_checks")
              con.commit()
              con.close()
          PY

            TELEGRAM_TOKEN="" TELEGRAM_CHAT_ID="" python -m app.main --once || true

            TELEGRAM_TOKEN="$SANDBOX_TELEGRAM_TOKEN" TELEGRAM_CHAT_ID="$SANDBOX_TELEGRAM_CHAT_ID" python - <<'PY'
          import os, sqlite3, urllib.parse, urllib.request, yaml
          from datetime import datetime, timezone, timedelta

          MAX_TOTAL_PIX_BRL = 2500.00

          def brl(value):
              return f"R$ {value:,.2f}".replace(",", "X").replace(".", ",").replace("X", ".")

          db_path = "data/flight_prices.sqlite3"
          if not os.path.exists(db_path):
              raise SystemExit(0)

          with open("config.yaml", "r", encoding="utf-8") as f:
              cfg = yaml.safe_load(f)

          active_monitors = {m["name"]: m["url"] for m in cfg.get("monitors", []) if m.get("enabled", True)}

          con = sqlite3.connect(db_path)
          con.row_factory = sqlite3.Row
          rows = con.execute("""
              SELECT monitor_name, checked_at, min_price_brl
              FROM price_checks
              WHERE id IN (SELECT MAX(id) FROM price_checks GROUP BY monitor_name)
          """).fetchall()

          all_results, approved_results = [], []
          for row in rows:
              name = row["monitor_name"]
              if name in active_monitors and row["min_price_brl"] is not None:
                  total_pix = float(row["min_price_brl"])
                  parts = [p.strip() for p in name.split("|")]
                  item = {
                      "name": name,
                      "city": parts[0] if len(parts) > 0 else name,
                      "ida": parts[1] if len(parts) > 1 else "Ver no link",
                      "volta": parts[2] if len(parts) > 2 else "Ver no link",
                      "total_pix": total_pix,
                      "url": active_monitors[name],
                  }
                  all_results.append(item)
                  if total_pix <= MAX_TOTAL_PIX_BRL:
                      approved_results.append(item)

          token = os.environ.get("TELEGRAM_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat_id:
              raise SystemExit(0)

          url_api = f"https://api.telegram.org/bot{token}/sendMessage"

          def send_telegram(msg_html):
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id, "text": msg_html, "parse_mode": "HTML", "disable_web_page_preview": "true"
              }).encode("utf-8")
              req = urllib.request.Request(url_api, data=payload, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  response.read()

          now_br = datetime.now(timezone(timedelta(hours=-3))).strftime("%d/%m/%Y às %H:%M")

          if approved_results:
              approved_results.sort(key=lambda x: x["total_pix"])
              for item in approved_results:
                  card = "\n".join([
                      f"💰 <b>TOTAL A PAGAR NO PIX: {brl(item['total_pix'])}</b>",
                      "✅ <i>2 adultos c/ taxas | Direto ou máx. 1 parada (31/12 chegando até 18h)</i>",
                      "🎉 <b>OFERTA DE RÉVEILLON DENTRO DO TETO DE R$ 2.500!</b>",
                      "",
                      f"📍 <b>Destino:</b> {item['city']} <i>(Saindo de Confins)</i>",
                      f"🛫 <b>Data de IDA:</b> {item['ida']}",
                      f"🛬 <b>Data de VOLTA:</b> {item['volta']}",
                      f"🕒 <b>Verificado em:</b> {now_br}",
                      "",
                      f"🔗 <a href=\"{item['url']}\"><b>CLIQUE AQUI PARA ABRIR O SITE NESTA DATA</b></a>"
                  ])
                  send_telegram(card)

          if all_results:
              best_overall, best_before_31, best_on_31 = {}, {}, {}
              for item in all_results:
                  c = item["city"]
                  if c not in best_overall or item["total_pix"] < best_overall[c]["total_pix"]:
                      best_overall[c] = item
                  if item["ida"].startswith("31/12"):
                      if c not in best_on_31 or item["total_pix"] < best_on_31[c]["total_pix"]:
                          best_on_31[c] = item
                  else:
                      if c not in best_before_31 or item["total_pix"] < best_before_31[c]["total_pix"]:
                          best_before_31[c] = item

              sorted_cities = sorted(best_overall.keys(), key=lambda c: best_overall[c]["total_pix"])
              lines = [
                  f"📊 <b>[1ª MENSAGEM] MENOR TOTAL POR DESTINO ({now_br})</b>",
                  "💳 <i>Total Pix 2 adultos | Sem 2 paradas | Dia 31/12 só chegando até 18h</i>",
                  f"🎯 <i>Seu teto máximo: até {brl(MAX_TOTAL_PIX_BRL)}</i>",
                  ""
              ]
              for i, c in enumerate(sorted_cities, 1):
                  lines.append(f"{i}º 📍 <b>{c}</b>")
                  if c in best_before_31:
                      b = best_before_31[c]
                      st = "✅ <b>NO TETO!</b>" if b["total_pix"] <= MAX_TOTAL_PIX_BRL else "⏳ Acima"
                      lines.append(
                          f"   🌟 <b>Indo antes ({b['ida'][:5]} a {b['volta'][:5]}):</b> {brl(b['total_pix'])} ({st}) — <a href=\"{b['url']}\">🔗 Abrir</a>"
                      )
                  if c in best_on_31:
                      o = best_on_31[c]
                      st = "✅ <b>NO TETO!</b>" if o["total_pix"] <= MAX_TOTAL_PIX_BRL else "⏳ Acima"
                      lines.append(
                          f"   🥂 <b>Indo dia 31 até 18h ({o['ida'][:5]} a {o['volta'][:5]}):</b> {brl(o['total_pix'])} ({st}) — <a href=\"{o['url']}\">🔗 Abrir</a>"
                      )
                  lines.append("")
              send_telegram("\n".join(lines))
          PY

            if [ "$CICLO" -lt 3 ]; then
              sleep 300
            fi
          done

      - name: Salvar historico no repositorio
        if: always()
        run: |
          rm -f sitecustomize.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ screenshots/ || true
          git diff --cached --quiet || git commit -m "Atualiza historico de precos"
          git push || true
