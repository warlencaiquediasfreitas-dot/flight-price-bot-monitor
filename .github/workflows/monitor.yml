name: Monitorar página

on:
  workflow_dispatch:
  schedule:
    # Dispara a cada 15 minutos (24h por dia) para manter sempre a proxima execucao pronta na fila
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: flight-price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar navegador do Playwright
        run: python -m playwright install --with-deps chromium

      - name: Ativar captura exclusiva do Total no Pix
        run: |
          python - <<'PY'
          import os
          import sqlite3

          os.makedirs("data", exist_ok=True)
          marker = "data/.total_no_pix_ativo"
          db_path = "data/flight_prices.sqlite3"
          if not os.path.exists(marker):
              if os.path.exists(db_path):
                  con = sqlite3.connect(db_path)
                  con.execute("DELETE FROM price_checks")
                  con.commit()
                  con.close()
              with open(marker, "w", encoding="utf-8") as f:
                  f.write("ok")

          code = '''import re

          _orig_compile = re.compile
          _orig_findall = re.findall
          _orig_finditer = re.finditer

          _PIX_RE = _orig_compile(
              r"Total\\s+no\\s+Pix[^R\\d]{0,30}R\\$\\s*\\d[\\d\\.,]*",
              re.IGNORECASE
          )
          _TAG_RE = _orig_compile(r"<[^>]+>")

          def _filter_total_pix(text):
              if not isinstance(text, str):
                  return text
              if "total no pix" not in text.lower():
                  return text
              clean = _TAG_RE.sub(" ", text)
              matches = _PIX_RE.findall(clean)
              if matches:
                  return " | ".join(matches)
              return text

          class _PatternProxy:
              def __init__(self, pat):
                  self._pat = pat
              def findall(self, string, *args, **kwargs):
                  return self._pat.findall(_filter_total_pix(string), *args, **kwargs)
              def finditer(self, string, *args, **kwargs):
                  return self._pat.finditer(_filter_total_pix(string), *args, **kwargs)
              def search(self, string, *args, **kwargs):
                  return self._pat.search(_filter_total_pix(string), *args, **kwargs)
              def __getattr__(self, name):
                  return getattr(self._pat, name)

          def _compile_proxy(pattern, flags=0):
              pat = _orig_compile(pattern, flags)
              pat_str = pattern if isinstance(pattern, str) else ""
              if "R$" in pat_str or "R\\$" in pat_str or "\\d" in pat_str:
                  return _PatternProxy(pat)
              return pat

          def _findall_proxy(pattern, string, flags=0):
              return _orig_findall(pattern, _filter_total_pix(string), flags)

          def _finditer_proxy(pattern, string, flags=0):
              return _orig_finditer(pattern, _filter_total_pix(string), flags)

          re.compile = _compile_proxy
          re.findall = _findall_proxy
          re.finditer = _finditer_proxy
          '''
          with open("sitecustomize.py", "w", encoding="utf-8") as f:
              f.write(code)
          print("Filtro Total no Pix ativado com sucesso.")
          PY

      - name: Executar 3 baterias seguidas de pesquisa e envio no Telegram
        env:
          PYTHONPATH: "."
          SANDBOX_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          SANDBOX_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for CICLO in 1 2 3; do
            echo "=================================================="
            echo "Iniciando bateria $CICLO de 3..."
            echo "=================================================="

            # 1) Pesquisa todos os voos em modo silencioso
            TELEGRAM_TOKEN="" TELEGRAM_CHAT_ID="" python -m app.main --once || true

            # 2) Envia imediatamente o relatorio desta bateria para o Telegram
            TELEGRAM_TOKEN="$SANDBOX_TELEGRAM_TOKEN" TELEGRAM_CHAT_ID="$SANDBOX_TELEGRAM_CHAT_ID" python - <<'PY'
          import os
          import sqlite3
          import urllib.parse
          import urllib.request
          import yaml
          from datetime import datetime, timezone, timedelta

          MAX_TOTAL_PIX_BRL = 2500.00

          def brl(value):
              return f"R$ {value:,.2f}".replace(",", "X").replace(".", ",").replace("X", ".")

          db_path = "data/flight_prices.sqlite3"
          if not os.path.exists(db_path):
              print("Base de dados ainda não existe.")
              raise SystemExit(0)

          with open("config.yaml", "r", encoding="utf-8") as f:
              cfg = yaml.safe_load(f)

          active_monitors = {}
          for m in cfg.get("monitors", []):
              if m.get("enabled", True):
                  active_monitors[m["name"]] = m["url"]

          con = sqlite3.connect(db_path)
          con.row_factory = sqlite3.Row

          rows = con.execute("""
              SELECT monitor_name, checked_at, min_price_brl
              FROM price_checks
              WHERE id IN (
                  SELECT MAX(id)
                  FROM price_checks
                  GROUP BY monitor_name
              )
          """).fetchall()

          all_results = []
          approved_results = []

          for row in rows:
              name = row["monitor_name"]
              if name in active_monitors and row["min_price_brl"] is not None:
                  total_pix = float(row["min_price_brl"])
                  parts = [p.strip() for p in name.split("|")]
                  city = parts[0] if len(parts) > 0 else name
                  ida = parts[1] if len(parts) > 1 else "Ver no link"
                  volta = parts[2] if len(parts) > 2 else "Ver no link"

                  item = {
                      "name": name,
                      "city": city,
                      "ida": ida,
                      "volta": volta,
                      "total_pix": total_pix,
                      "url": active_monitors[name],
                  }
                  all_results.append(item)
                  if total_pix <= MAX_TOTAL_PIX_BRL:
                      approved_results.append(item)

          token = os.environ.get("TELEGRAM_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")

          if not token or not chat_id:
              print("Telegram não configurado nos Secrets.")
              raise SystemExit(0)

          url_api = f"https://api.telegram.org/bot{token}/sendMessage"

          def send_telegram(msg_html):
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": msg_html,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode("utf-8")
              req = urllib.request.Request(url_api, data=payload, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  response.read()

          br_tz = timezone(timedelta(hours=-3))
          now_br = datetime.now(br_tz).strftime("%d/%m/%Y às %H:%M")

          if approved_results:
              approved_results.sort(key=lambda x: x["total_pix"])
              for item in approved_results:
                  card = "\n".join([
                      f"💰 <b>TOTAL A PAGAR NO PIX: {brl(item['total_pix'])}</b>",
                      "✅ <i>Valor final para os 2 adultos (Ida e Volta + taxas inclusas)</i>",
                      "🎉 <b>OFERTA DE RÉVEILLON DENTRO DO TETO DE R$ 2.500!</b>",
                      "",
                      f"📍 <b>Destino:</b> {item['city']} <i>(Saindo de Confins)</i>",
                      f"🛫 <b>Data de IDA:</b> {item['ida']}",
                      f"🛬 <b>Data de VOLTA:</b> {item['volta']}",
                      f"🕒 <b>Verificado em:</b> {now_br}",
                      "",
                      f"🔗 <a href=\"{item['url']}\"><b>CLIQUE AQUI PARA ABRIR O SITE NESTA DATA</b></a>"
                  ])
                  send_telegram(card)

          if all_results:
              best_per_city = {}
              for item in all_results:
                  c = item["city"]
                  if c not in best_per_city or item["total_pix"] < best_per_city[c]["total_pix"]:
                      best_per_city[c] = item

              sorted_cities = sorted(best_per_city.values(), key=lambda x: x["total_pix"])

              lines = [
                  f"📊 <b>MENOR TOTAL A PAGAR POR DESTINO ({now_br})</b>",
                  "💳 <i>Valor final no Pix para 2 adultos (já com todas as taxas)</i>",
                  f"🎯 <i>Seu teto máximo: até {brl(MAX_TOTAL_PIX_BRL)}</i>",
                  ""
              ]

              for i, item in enumerate(sorted_cities, 1):
                  status = "✅ <b>DENTRO DO TETO!</b>" if item["total_pix"] <= MAX_TOTAL_PIX_BRL else "⏳ Acima de R$ 2.500"
                  lines.extend([
                      f"{i}º 💰 <b>Total no Pix: {brl(item['total_pix'])}</b> — <b>{item['city']}</b> ({status})",
                      f"   🛫 <b>Ida:</b> {item['ida']} | 🛬 <b>Volta:</b> {item['volta']} — <a href=\"{item['url']}\">🔗 Abrir site</a>",
                      ""
                  ])

              send_telegram("\n".join(lines))
              print("Resumo com valores finais enviado com sucesso.")
          PY

            # 3) Aguarda 5 minutos antes de iniciar a proxima bateria na mesma maquina
            if [ "$CICLO" -lt 3 ]; then
              echo "Aguardando 5 minutos antes da proxima pesquisa..."
              sleep 300
            fi
          done

      - name: Salvar historico no repositorio
        if: always()
        run: |
          rm -f sitecustomize.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ screenshots/ || true
          git diff --cached --quiet || git commit -m "Atualiza historico de precos"
          git push || true
