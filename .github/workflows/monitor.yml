name: Monitorar página

on:
  workflow_dispatch:
  schedule:
    # Monitoramento de quedas bruscas: uma vez por hora no minuto 35
    - cron: "35 * * * *"

    # Status no Telegram de MADRUGADA (00h às 06h no Brasil = 03h às 09h UTC): de 1 em 1 hora
    - cron: "5 3-9 * * *"

    # Status no Telegram no RESTANTE DO DIA (08h às 22h no Brasil): a cada 2 horas
    - cron: "5 1,11,13,15,17,19,21,23 * * *"

permissions:
  contents: write

concurrency:
  group: flight-price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar navegador do Playwright
        run: python -m playwright install --with-deps chromium

      - name: Rodar robo uma vez
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m app.main --once

      - name: Enviar status de rotina no Telegram
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule != '35 * * * *')
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import sqlite3
          import urllib.parse
          import urllib.request
          import yaml
          from datetime import datetime, timezone, timedelta

          def brl(value):
              return f"R$ {value:,.2f}".replace(",", "X").replace(".", ",").replace("X", ".")

          db_path = "data/flight_prices.sqlite3"
          if not os.path.exists(db_path):
              print("Base de dados ainda não existe.")
              raise SystemExit(0)

          with open("config.yaml", "r", encoding="utf-8") as f:
              cfg = yaml.safe_load(f)

          active_monitors = {}
          for m in cfg.get("monitors", []):
              if m.get("enabled", True):
                  active_monitors[m["name"]] = m["url"]

          con = sqlite3.connect(db_path)
          con.row_factory = sqlite3.Row

          rows = con.execute("""
              SELECT monitor_name, checked_at, min_price_brl
              FROM price_checks
              WHERE id IN (
                  SELECT MAX(id)
                  FROM price_checks
                  GROUP BY monitor_name
              )
          """).fetchall()

          results = []
          for row in rows:
              name = row["monitor_name"]
              if name in active_monitors and row["min_price_brl"] is not None:
                  results.append({
                      "name": name,
                      "price": float(row["min_price_brl"]),
                      "url": active_monitors[name],
                  })

          if not results:
              print("Sem consultas salvas para os destinos atuais.")
              raise SystemExit(0)

          br_tz = timezone(timedelta(hours=-3))
          now_br = datetime.now(br_tz).strftime("%d/%m/%Y às %H:%M")

          # Ordenar pelos mais baratos para o Top 5
          top5 = sorted(results, key=lambda x: x["price"])[:5]

          lines = [
              "✈️ <b>RELATÓRIO DE PASSAGENS (Saindo de Confins)</b>",
              f"🕒 <i>Atualizado em: {now_br} (BRT)</i>",
              "",
              "🏆 <b>TOP 5 MAIS BARATOS AGORA:</b>"
          ]

          for i, item in enumerate(top5, 1):
              lines.append(
                  f"{i}º <b>{item['name']}</b>: {brl(item['price'])} — <a href=\"{item['url']}\">🔗 Abrir site</a>"
              )

          # Agrupar por cidade na ordem do config.yaml
          cities = {}
          for name in active_monitors:
              city = name.split("|")[0].strip() if "|" in name else name
              cities.setdefault(city, [])

          price_map = {r["name"]: r for r in results}
          for name, url in active_monitors.items():
              if name in price_map:
                  city = name.split("|")[0].strip() if "|" in name else name
                  dates = name.split("|")[1].strip() if "|" in name else name
                  cities[city].append((dates, price_map[name]["price"], url))

          for city, items in cities.items():
              if not items:
                  continue
              lines.append("")
              lines.append(f"📍 <b>{city.upper()}</b>")
              for dates, price, url in items:
                  lines.append(f"• {dates}: <b>{brl(price)}</b> (<a href=\"{url}\">🔗 Link</a>)")

          token = os.environ.get("TELEGRAM_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")

          if not token or not chat_id:
              print("Telegram não configurado nos Secrets.")
              raise SystemExit(0)

          # Enviar em blocos caso o texto fique grande
          chunks = []
          current_chunk = []
          current_len = 0
          for line in lines:
              if current_len + len(line) + 1 > 3500:
                  chunks.append("\n".join(current_chunk))
                  current_chunk = [line]
                  current_len = len(line)
              else:
                  current_chunk.append(line)
                  current_len += len(line) + 1
          if current_chunk:
              chunks.append("\n".join(current_chunk))

          url_api = f"https://api.telegram.org/bot{token}/sendMessage"
          for chunk in chunks:
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": chunk,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode("utf-8")
              req = urllib.request.Request(url_api, data=payload, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  response.read()

          print("Relatório organizado enviado por Telegram.")
          PY

      - name: Salvar historico no repositorio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ screenshots/ || true
          git diff --cached --quiet || git commit -m "Atualiza historico de precos"
          git push || true
