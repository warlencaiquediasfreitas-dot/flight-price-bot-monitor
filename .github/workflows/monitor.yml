name: Monitorar página

on:
  workflow_dispatch:
  schedule:
    # MADRUGADA (00h às 06h BRT = 03h às 09h UTC): tenta nos minutos 18 e 48 para garantir a execução
    - cron: "18,48 3-9 * * *"

    # DIA E NOITE (de 2 em 2 horas no Brasil): tenta nos minutos 18 e 48
    - cron: "18,48 1,11,13,15,17,19,21,23 * * *"

permissions:
  contents: write

concurrency:
  group: flight-price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar navegador do Playwright
        run: python -m playwright install --with-deps chromium

      - name: Pesquisar passagens nos sites (silencioso)
        env:
          TELEGRAM_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
        run: python -m app.main --once

      - name: Enviar ofertas ate R$ 1350 e resumo por destino no Telegram
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import sqlite3
          import urllib.parse
          import urllib.request
          import yaml
          from datetime import datetime, timezone, timedelta

          MAX_PRICE_PER_PERSON = 1350.00

          def brl(value):
              return f"R$ {value:,.2f}".replace(",", "X").replace(".", ",").replace("X", ".")

          db_path = "data/flight_prices.sqlite3"
          if not os.path.exists(db_path):
              print("Base de dados ainda não existe.")
              raise SystemExit(0)

          with open("config.yaml", "r", encoding="utf-8") as f:
              cfg = yaml.safe_load(f)

          active_monitors = {}
          for m in cfg.get("monitors", []):
              if m.get("enabled", True):
                  active_monitors[m["name"]] = m["url"]

          con = sqlite3.connect(db_path)
          con.row_factory = sqlite3.Row

          rows = con.execute("""
              SELECT monitor_name, checked_at, min_price_brl
              FROM price_checks
              WHERE id IN (
                  SELECT MAX(id)
                  FROM price_checks
                  GROUP BY monitor_name
              )
          """).fetchall()

          all_results = []
          approved_results = []

          for row in rows:
              name = row["monitor_name"]
              if name in active_monitors and row["min_price_brl"] is not None:
                  price = float(row["min_price_brl"])
                  parts = [p.strip() for p in name.split("|")]
                  city = parts[0] if len(parts) > 0 else name
                  ida = parts[1] if len(parts) > 1 else "Ver no link"
                  volta = parts[2] if len(parts) > 2 else "Ver no link"

                  item = {
                      "name": name,
                      "city": city,
                      "ida": ida,
                      "volta": volta,
                      "price": price,
                      "total_couple": price * 2,
                      "url": active_monitors[name],
                  }
                  all_results.append(item)
                  if price <= MAX_PRICE_PER_PERSON:
                      approved_results.append(item)

          token = os.environ.get("TELEGRAM_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")

          if not token or not chat_id:
              print("Telegram não configurado nos Secrets.")
              raise SystemExit(0)

          url_api = f"https://api.telegram.org/bot{token}/sendMessage"

          def send_telegram(msg_html):
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": msg_html,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode("utf-8")
              req = urllib.request.Request(url_api, data=payload, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  response.read()

          br_tz = timezone(timedelta(hours=-3))
          now_br = datetime.now(br_tz).strftime("%d/%m/%Y às %H:%M")

          # 1) ALERTA IMEDIATO: Sempre que achar passagem até R$ 1.350,00 por pessoa
          if approved_results:
              approved_results.sort(key=lambda x: x["price"])
              for item in approved_results:
                  card = "\n".join([
                      f"💰 <b>PREÇO: {brl(item['price'])} por pessoa (Ida e Volta)</b>",
                      f"👥 <b>Total casal (4 passagens): {brl(item['total_couple'])}</b>",
                      "🎉 <b>OFERTA DE RÉVEILLON DENTRO DO LIMITE DE R$ 1.350!</b>",
                      "",
                      f"📍 <b>Destino:</b> {item['city']} <i>(Saindo de Confins)</i>",
                      f"🛫 <b>Data de IDA:</b> {item['ida']}",
                      f"🛬 <b>Data de VOLTA:</b> {item['volta']}",
                      f"🕒 <b>Verificado em:</b> {now_br}",
                      "",
                      f"🔗 <a href=\"{item['url']}\"><b>CLIQUE AQUI PARA ABRIR O SITE NESTA DATA</b></a>"
                  ])
                  send_telegram(card)

          # 2) ATUALIZAÇÃO DOS 7 DESTINOS: Mostra o menor valor atual de cada cidade
          if all_results:
              best_per_city = {}
              for item in all_results:
                  c = item["city"]
                  if c not in best_per_city or item["price"] < best_per_city[c]["price"]:
                      best_per_city[c] = item

              sorted_cities = sorted(best_per_city.values(), key=lambda x: x["price"])

              lines = [
                  f"📊 <b>MENOR PREÇO POR DESTINO ({now_br})</b>",
                  f"🎯 <i>Sua meta: até R$ 1.350,00 por pessoa</i>",
                  ""
              ]

              for i, item in enumerate(sorted_cities, 1):
                  status = "✅ <b>DENTRO DA META!</b>" if item["price"] <= MAX_PRICE_PER_PERSON else "⏳ Acima da meta"
                  lines.extend([
                      f"{i}º 💰 <b>{brl(item['price'])}</b> — <b>{item['city']}</b> ({status})",
                      f"   🛫 <b>Ida:</b> {item['ida']} | 🛬 <b>Volta:</b> {item['volta']}",
                      f"   👥 Casal: {brl(item['total_couple'])} — <a href=\"{item['url']}\">🔗 Abrir site</a>",
                      ""
                  ])

              send_telegram("\n".join(lines))
              print("Resumo por destino enviado com sucesso.")
          PY

      - name: Salvar historico no repositorio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ screenshots/ || true
          git diff --cached --quiet || git commit -m "Atualiza historico de precos"
          git push || true
