name: "PROMPTER VINICIUS"

on:
  workflow_dispatch:
  schedule:
    # Agendamento nos minutos intercalados sugeridos pelo Vinicius (7, 22, 37, 52)
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: flight-price-monitor-vinicius
  cancel-in-progress: true

jobs:
  vinicius_bot:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias Python (Playwright Assincrono)
        run: |
          python -m pip install --upgrade pip
          pip install playwright aiohttp
          python -m playwright install --with-deps chromium

      - name: Executar Motor Assincrono (Prompter Vinicius)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'EOF'
          import asyncio
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, date, timezone
          from decimal import Decimal
          from playwright.async_api import async_playwright

          # === CONFIGURACOES EXIGIDAS NO PROMPT ===
          MAX_CONCURRENT_PAGES = 6
          MAX_RETRIES = 2
          CNF_REPOSITIONING_COST_BRL = Decimal("300.00")
          MAX_COMPARABLE_COST_BRL = Decimal("3000.00")
          MIN_ABSOLUTE_DROP_BRL = Decimal("50.00")
          MIN_PERCENT_DROP = Decimal("3.0")

          NORTHEAST_AIRPORTS = ["JPA", "SSA", "IOS", "BPS", "MCZ", "NAT", "FOR", "REC", "AJU", "SLZ", "JJD", "TXF"]
          IDAS_DATES = ["2026-12-26", "2026-12-27", "2026-12-28", "2026-12-29", "2026-12-30", "2026-12-31"]
          VOLTAS_DATES = ["2027-01-02", "2027-01-03", "2027-01-04", "2027-01-05", "2027-01-06",
                          "2027-01-07", "2027-01-08", "2027-01-09", "2027-01-10", "2027-01-11"]

          OPEN_JAW_BUS_COSTS = {
              frozenset(["NAT", "JPA"]): Decimal("180.00"),
              frozenset(["JPA", "REC"]): Decimal("120.00"),
              frozenset(["NAT", "REC"]): Decimal("280.00"),
              frozenset(["REC", "MCZ"]): Decimal("220.00"),
              frozenset(["JPA", "MCZ"]): Decimal("300.00"),
              frozenset(["MCZ", "AJU"]): Decimal("240.00"),
              frozenset(["REC", "AJU"]): Decimal("400.00"),
              frozenset(["AJU", "SSA"]): Decimal("320.00"),
              frozenset(["SSA", "IOS"]): Decimal("500.00"),
              frozenset(["IOS", "BPS"]): Decimal("350.00"),
              frozenset(["BPS", "TXF"]): Decimal("240.00"),
              frozenset(["FOR", "JJD"]): Decimal("280.00"),
          }

          PIX_RE = re.compile(r"Total\s+no\s+Pix[^R\d]{0,30}R\$\s*([\d\.,]+)", re.IGNORECASE)

          def extract_total_pix(text):
              if not text: return None
              clean = re.sub(r"<[^>]+>", " ", text)
              matches = PIX_RE.findall(clean)
              if matches:
                  val = matches[0].replace(".", "").replace(",", ".")
                  try:
                      return Decimal(val)
                  except:
                      return None
              return None

          class FlightLeg:
              def __init__(self, direction, origin, destination, dep_date, url):
                  self.direction = direction
                  self.origin = origin
                  self.destination = destination
                  self.departure_date = dep_date
                  self.url = url

          async def scrape_leg(context, leg, semaphore):
              async with semaphore:
                  for attempt in range(MAX_RETRIES + 1):
                      page = await context.new_page()
                      try:
                          await page.goto(leg.url, timeout=45000, wait_until="domcontentloaded")
                          await page.wait_for_timeout(5000) # Aguarda renderizacao do React da 123Milhas
                          
                          content = await page.content()
                          total_pix = extract_total_pix(content)
                          if total_pix: return leg, total_pix, "SUCCESS"
                          
                          await page.wait_for_timeout(4000) # Retry local antes de falhar
                          content = await page.content()
                          total_pix = extract_total_pix(content)
                          if total_pix: return leg, total_pix, "SUCCESS"
                          
                          return leg, None, "TOTAL_PIX_NOT_FOUND"
                      except Exception as e:
                          if attempt == MAX_RETRIES:
                              return leg, None, "TIMEOUT_OR_ERROR"
                          await asyncio.sleep(3 if attempt == 0 else 8)
                      finally:
                          await page.close()

          async def run_scraper():
              searches = []
              # 1. Gerar 72 Idas
              for dest in NORTHEAST_AIRPORTS:
                  for d in IDAS_DATES:
                      d_fmt = f"{d[8:10]}-{d[5:7]}-{d[0:4]}"
                      url = f"https://123milhas.com/v2/busca?de=CNF&para={dest}&adultos=2&criancas=0&bebes=0&ida={d_fmt}&classe=3&is_loyalty=0"
                      searches.append(FlightLeg("IDA", "CNF", dest, d, url))
              
              # 2. Gerar 120 Voltas
              for orig in NORTHEAST_AIRPORTS:
                  for d in VOLTAS_DATES:
                      d_fmt = f"{d[8:10]}-{d[5:7]}-{d[0:4]}"
                      url = f"https://123milhas.com/v2/busca?de={orig}&para=CNF&adultos=2&criancas=0&bebes=0&ida={d_fmt}&classe=3&is_loyalty=0"
                      searches.append(FlightLeg("VOLTA", orig, "CNF", d, url))

              semaphore = asyncio.Semaphore(MAX_CONCURRENT_PAGES)
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context(user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36")
                  
                  print(f"Iniciando varredura paralela de {len(searches)} URLs com {MAX_CONCURRENT_PAGES} workers...")
                  tasks = [scrape_leg(context, s, semaphore) for s in searches]
                  results = await asyncio.gather(*tasks)
                  await browser.close()
                  
              return results

          def combine_and_alert(results):
              idas = [r for r in results if r[0].direction == "IDA" and r[1] is not None]
              voltas = [r for r in results if r[0].direction == "VOLTA" and r[1] is not None]
              
              valid_trips = []
              for i_leg, i_price, _ in idas:
                  for v_leg, v_price, _ in voltas:
                      # Regra: Minimo 5 dias
                      d_ida = date.fromisoformat(i_leg.departure_date)
                      d_volta = date.fromisoformat(v_leg.departure_date)
                      days = (d_volta - d_ida).days
                      if days < 5: continue
                      
                      # Regra: Aeroportos Permitidos (Convencional ou Open-Jaw)
                      is_open_jaw = False
                      bus_cost = None
                      if i_leg.destination != v_leg.origin:
                          pair = frozenset([i_leg.destination, v_leg.origin])
                          if pair in OPEN_JAW_BUS_COSTS:
                              is_open_jaw = True
                              bus_cost = OPEN_JAW_BUS_COSTS[pair]
                          else:
                              continue # Corta pares proibidos (ex: FOR com NAT)
                      
                      # Regra: Custo Comparavel <= 3000
                      comp_cost = i_price + v_price + CNF_REPOSITIONING_COST_BRL
                      if comp_cost <= MAX_COMPARABLE_COST_BRL:
                          trip_key = f"{i_leg.origin}|{i_leg.destination}|{i_leg.departure_date}|{v_leg.origin}|{v_leg.destination}|{v_leg.departure_date}"
                          valid_trips.append({
                              "key": trip_key,
                              "outbound": i_leg, "inbound": v_leg,
                              "o_price": i_price, "i_price": v_price,
                              "comp_cost": comp_cost,
                              "is_open_jaw": is_open_jaw,
                              "bus_cost": bus_cost,
                              "days": days
                          })
                          
              # 3. Regra de Deduplicacao (alert_state.json)
              os.makedirs("data", exist_ok=True)
              state_file = "data/alert_state.json"
              state = {"alerts": {}}
              if os.path.exists(state_file):
                  with open(state_file, "r") as f:
                      state = json.load(f)
                      
              alerts_to_send = []
              for t in valid_trips:
                  k = t["key"]
                  curr_cost = t["comp_cost"]
                  send = False
                  if k not in state["alerts"]:
                      send = True
                  else:
                      last_cost = Decimal(str(state["alerts"][k]["last_cost_brl"]))
                      diff = last_cost - curr_cost
                      # So manda de novo se cair R$ 50 ou cair 3%
                      if diff >= MIN_ABSOLUTE_DROP_BRL or (last_cost > 0 and (diff / last_cost) * 100 >= MIN_PERCENT_DROP):
                          send = True
                  
                  if send:
                      alerts_to_send.append(t)
                      state["alerts"][k] = {
                          "last_cost_brl": float(curr_cost),
                          "last_sent_at": datetime.now(timezone.utc).isoformat()
                      }
                      
              with open(state_file, "w") as f:
                  json.dump(state, f, indent=2)
                  
              # 4. Envio ao Telegram
              alerts_to_send.sort(key=lambda x: x["comp_cost"])
              
              token = os.environ.get("TELEGRAM_TOKEN", "")
              chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
              if not token or not chat_id: return
              
              url_api = f"https://api.telegram.org/bot{token}/sendMessage"
              
              def brl(val):
                  return f"R$ {val:,.2f}".replace(",", "X").replace(".", ",").replace("X", ".")
                  
              for t in alerts_to_send:
                  d_ida = datetime.fromisoformat(t['outbound'].departure_date).strftime('%d/%m/%Y')
                  d_volta = datetime.fromisoformat(t['inbound'].departure_date).strftime('%d/%m/%Y')
                  
                  lines = [
                      f"🎉 <b>[PROMPTER VINICIUS] OFERTA DENTRO DO TETO</b>\n",
                      f"💰 <b>Custo comparável: {brl(t['comp_cost'])}</b>",
                      f"✈️ Voos p/ 2 adultos (c/ taxas): {brl(t['o_price'] + t['i_price'])}",
                      f"🚌 Reposicionamento até CNF: R$ 300,00\n",
                      f"🛫 <b>IDA</b>",
                      f"{t['outbound'].origin} ➔ {t['outbound'].destination}",
                      f"Data: {d_ida}",
                      f"Total no Pix: {brl(t['o_price'])}",
                      f"<a href=\"{t['outbound'].url}\">🔗 Abrir busca de Ida</a>\n",
                      f"🛬 <b>VOLTA</b>",
                      f"{t['inbound'].origin} ➔ {t['inbound'].destination}",
                      f"Data: {d_volta}",
                      f"Total no Pix: {brl(t['i_price'])}",
                      f"<a href=\"{t['inbound'].url}\">🔗 Abrir busca de Volta</a>\n"
                  ]
                  if t['is_open_jaw']:
                      lines.extend([
                          f"🗺️ <b>Open-jaw:</b> Chegada por {t['outbound'].destination} e retorno por {t['inbound'].origin}",
                          f"🚌 Ônibus estimado p/ 2 pessoas: {brl(t['bus_cost'])}\n"
                      ])
                  else:
                      lines.extend([f"📍 Ida e volta pelo mesmo aeroporto: {t['outbound'].destination}\n"])
                      
                  lines.append(f"⏱️ <b>Duração:</b> {t['days']} dias")
                  
                  msg = "\n".join(lines)
                  try:
                      payload = urllib.parse.urlencode({"chat_id": chat_id, "text": msg, "parse_mode": "HTML", "disable_web_page_preview": "true"}).encode("utf-8")
                      req = urllib.request.Request(url_api, data=payload, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          response.read()
                  except: pass

          if __name__ == "__main__":
              res = asyncio.run(run_scraper())
              combine_and_alert(res)
          EOF

      - name: Salvar estado dos alertas (Deduplicacao do Vinicius)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/alert_state.json || true
          git diff --cached --quiet || git commit -m "Atualiza base de alertas do Vinicius"
          git push || true
