name: Monitorar Folga e Cidades Proximas

on:
  workflow_dispatch:
  schedule:
    # Dispara a cada 20 minutos em paralelo ao robo principal
    - cron: "*/20 * * * *"

permissions:
  contents: read

concurrency:
  group: flight-price-monitor-folga
  cancel-in-progress: false

jobs:
  # =========================================================================
  # MENSAGEM 2: VIAGEM ESTENDIDA (IDA 29 A 31/12 | VOLTA 07, 08, 09, 10 E 11/01)
  # =========================================================================
  mensagem_2_folga:
    name: "Mensagem 2 - Voltas 07 a 11 de Janeiro"
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar navegador do Playwright
        run: python -m playwright install --with-deps chromium

      - name: Preparar filtro Total no Pix e datas de 07/01 a 11/01
        run: |
          python - <<'PY'
          import os
          import yaml

          os.makedirs("data", exist_ok=True)
          if os.path.exists("data/flight_prices.sqlite3"):
              os.remove("data/flight_prices.sqlite3")

          # 1. Filtro para ler exclusivamente "Total no Pix: R$ ..."
          code = '''import re

          _orig_compile = re.compile
          _orig_findall = re.findall
          _orig_finditer = re.finditer

          _PIX_RE = _orig_compile(
              r"Total\\s+no\\s+Pix[^R\\d]{0,30}R\\$\\s*\\d[\\d\\.,]*",
              re.IGNORECASE
          )
          _TAG_RE = _orig_compile(r"<[^>]+>")

          def _filter_total_pix(text):
              if not isinstance(text, str):
                  return text
              if "total no pix" not in text.lower():
                  return text
              clean = _TAG_RE.sub(" ", text)
              matches = _PIX_RE.findall(clean)
              if matches:
                  return " | ".join(matches)
              return text

          class _PatternProxy:
              def __init__(self, pat):
                  self._pat = pat
              def findall(self, string, *args, **kwargs):
                  return self._pat.findall(_filter_total_pix(string), *args, **kwargs)
              def finditer(self, string, *args, **kwargs):
                  return self._pat.finditer(_filter_total_pix(string), *args, **kwargs)
              def search(self, string, *args, **kwargs):
                  return self._pat.search(_filter_total_pix(string), *args, **kwargs)
              def __getattr__(self, name):
                  return getattr(self._pat, name)

          def _compile_proxy(pattern, flags=0):
              pat = _orig_compile(pattern, flags)
              pat_str = pattern if isinstance(pattern, str) else ""
              if "R$" in pat_str or "R\\$" in pat_str or "\\d" in pat_str:
                  return _PatternProxy(pat)
              return pat

          def _findall_proxy(pattern, string, flags=0):
              return _orig_findall(pattern, _filter_total_pix(string), flags)

          def _finditer_proxy(pattern, string, flags=0):
              return _orig_finditer(pattern, _filter_total_pix(string), flags)

          re.compile = _compile_proxy
          re.findall = _findall_proxy
          re.finditer = _finditer_proxy
          '''
          with open("sitecustomize.py", "w", encoding="utf-8") as f:
              f.write(code)

          # 2. Gera config temporario na maquina virtual (sem alterar o repositorio)
          cities = [
              ("João Pessoa (JPA)", "JPA"),
              ("Salvador (SSA)", "SSA"),
              ("Ilhéus (IOS)", "IOS"),
              ("Porto Seguro (BPS)", "BPS"),
              ("Maceió (MCZ)", "MCZ"),
              ("Natal (NAT)", "NAT"),
              ("Fortaleza/Ceará (FOR)", "FOR"),
          ]
          idas = ["29-12-2026", "30-12-2026", "31-12-2026"]
          voltas = ["07-01-2027", "08-01-2027", "09-01-2027", "10-01-2027", "11-01-2027"]

          monitors = []
          for city_label, iata in cities:
              for ida in idas:
                  for volta in voltas:
                      ida_br = ida.replace("-", "/")
                      volta_br = volta.replace("-", "/")
                      monitors.append({
                          "name": f"{city_label} | {ida_br} | {volta_br}",
                          "provider": "generic",
                          "enabled": True,
                          "url": f"https://123milhas.com/v2/busca?de=CNF&para={iata}&adultos=2&criancas=0&bebes=0&ida={ida}&volta={volta}&classe=3&is_loyalty=0",
                          "max_price_brl": 2500.00,
                          "min_drop_percent": 5,
                          "alert_on_any_change": False,
                          "alert_when_price_below_max": True,
                      })

          cfg = {
              "settings": {
                  "check_interval_minutes": 30,
                  "headless": True,
                  "browser_timeout_seconds": 60,
                  "alert_cooldown_minutes": 120,
                  "user_agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36",
                  "screenshot_on_error": False,
                  "notify_on_recovery": False,
              },
              "monitors": monitors,
          }
          with open("config.yaml", "w", encoding="utf-8") as f:
              yaml.safe_dump(cfg, f, allow_unicode=True, sort_keys=False)
          print(f"Configuradas {len(monitors)} combinacoes para voltas de 07/01 a 11/01.")
          PY

      - name: Pesquisar voltas 07 a 11/01 e enviar 2a Mensagem no Telegram
        env:
          PYTHONPATH: "."
          SANDBOX_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          SANDBOX_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for CICLO in 1 2; do
            TELEGRAM_TOKEN="" TELEGRAM_CHAT_ID="" python -m app.main --once || true

            TELEGRAM_TOKEN="$SANDBOX_TELEGRAM_TOKEN" TELEGRAM_CHAT_ID="$SANDBOX_TELEGRAM_CHAT_ID" python - <<'PY'
          import os, sqlite3, urllib.parse, urllib.request, yaml
          from datetime import datetime, timezone, timedelta

          MAX_TOTAL_PIX_BRL = 2500.00

          def brl(value):
              return f"R$ {value:,.2f}".replace(",", "X").replace(".", ",").replace("X", ".")

          db_path = "data/flight_prices.sqlite3"
          if not os.path.exists(db_path):
              raise SystemExit(0)

          with open("config.yaml", "r", encoding="utf-8") as f:
              cfg = yaml.safe_load(f)

          active_monitors = {m["name"]: m["url"] for m in cfg.get("monitors", []) if m.get("enabled", True)}

          con = sqlite3.connect(db_path)
          con.row_factory = sqlite3.Row
          rows = con.execute("""
              SELECT monitor_name, checked_at, min_price_brl
              FROM price_checks
              WHERE id IN (SELECT MAX(id) FROM price_checks GROUP BY monitor_name)
          """).fetchall()

          all_results, approved_results = [], []
          for row in rows:
              name = row["monitor_name"]
              if name in active_monitors and row["min_price_brl"] is not None:
                  total_pix = float(row["min_price_brl"])
                  parts = [p.strip() for p in name.split("|")]
                  item = {
                      "name": name,
                      "city": parts[0] if len(parts) > 0 else name,
                      "ida": parts[1] if len(parts) > 1 else "",
                      "volta": parts[2] if len(parts) > 2 else "",
                      "total_pix": total_pix,
                      "url": active_monitors[name],
                  }
                  all_results.append(item)
                  if total_pix <= MAX_TOTAL_PIX_BRL:
                      approved_results.append(item)

          token = os.environ.get("TELEGRAM_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat_id:
              raise SystemExit(0)

          url_api = f"https://api.telegram.org/bot{token}/sendMessage"

          def send_telegram(msg_html):
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id, "text": msg_html, "parse_mode": "HTML", "disable_web_page_preview": "true"
              }).encode("utf-8")
              req = urllib.request.Request(url_api, data=payload, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  response.read()

          def dica_folga(volta_str):
              if volta_str.startswith("07/01"):
                  return "⏰ <i>Volta 07/01: Chegando cedo em CNF dá tempo de estar em Divinópolis às 12h (ou tire 1 dia de folga)</i>"
              if volta_str.startswith("11/01"):
                  return "🌙 <i>Volta 11/01: Confira se o voo sai de madrugada para chegar em Divinópolis até 12h (usando 2 dias de folga)</i>"
              return "🏖️ <i>Aproveita os 2 dias de folga (07 e 08/01) + fim de semana!</i>"

          now_br = datetime.now(timezone(timedelta(hours=-3))).strftime("%d/%m/%Y às %H:%M")

          # 1) Alerta individual se achar voo ate R$ 2.500 voltando entre 07/01 e 11/01
          if approved_results:
              approved_results.sort(key=lambda x: x["total_pix"])
              for item in approved_results[:5]:
                  card = "\n".join([
                      f"🌴 <b>[2ª MENSAGEM - OPÇÃO COM FOLGA] TOTAL PIX: {brl(item['total_pix'])}</b>",
                      "✅ <i>Valor final para 2 adultos (Ida e Volta + taxas)</i>",
                      dica_folga(item["volta"]),
                      "",
                      f"📍 <b>Destino:</b> {item['city']} <i>(Saindo de Confins)</i>",
                      f"🛫 <b>Ida:</b> {item['ida']} | 🛬 <b>Volta:</b> {item['volta']}",
                      f"🕒 <b>Verificado em:</b> {now_br}",
                      "",
                      f"🔗 <a href=\"{item['url']}\"><b>ABRIR PASSAGEM NO SITE</b></a>"
                  ])
                  send_telegram(card)

          # 2) Resumo comparativo (Voltas 07, 08, 09, 10 ou 11/01)
          if all_results:
              best_overall, best_29_30, best_31 = {}, {}, {}
              for item in all_results:
                  c = item["city"]
                  if c not in best_overall or item["total_pix"] < best_overall[c]["total_pix"]:
                      best_overall[c] = item
                  if item["ida"].startswith("31/12"):
                      if c not in best_31 or item["total_pix"] < best_31[c]["total_pix"]:
                          best_31[c] = item
                  else:
                      if c not in best_29_30 or item["total_pix"] < best_29_30[c]["total_pix"]:
                          best_29_30[c] = item

              sorted_cities = sorted(best_overall.keys(), key=lambda c: best_overall[c]["total_pix"])
              lines = [
                  f"🗓️ <b>[2ª MENSAGEM] VIAGEM MAIS LONGA / FOLGA ({now_br})</b>",
                  "✈️ <i>Idas: 29, 30 ou 31/12 | Voltas: 07, 08, 09, 10 ou 11/01/2027</i>",
                  "💼 <i>Ideal para usar os 2 dias de folga (07 e 08/01) e voltar até seg (11/01 cedo)</i>",
                  f"🎯 <i>Teto máximo: até {brl(MAX_TOTAL_PIX_BRL)} (Total Pix 2 adultos)</i>",
                  ""
              ]
              for i, c in enumerate(sorted_cities, 1):
                  lines.append(f"{i}º 📍 <b>{c}</b>")
                  if c in best_29_30:
                      b = best_29_30[c]
                      st = "✅ <b>NO TETO!</b>" if b["total_pix"] <= MAX_TOTAL_PIX_BRL else "⏳ Acima"
                      nota_11 = " ⚠️<i>(ver horário madrugada)</i>" if b["volta"].startswith("11/01") else ""
                      lines.append(
                          f"   🌟 <b>Ida {b['ida'][:5]} ➔ Volta {b['volta'][:5]}:</b> {brl(b['total_pix'])} ({st}){nota_11} — <a href=\"{b['url']}\">🔗 Abrir</a>"
                      )
                  if c in best_31:
                      o = best_31[c]
                      st = "✅ <b>NO TETO!</b>" if o["total_pix"] <= MAX_TOTAL_PIX_BRL else "⏳ Acima"
                      nota_11 = " ⚠️<i>(ver horário madrugada)</i>" if o["volta"].startswith("11/01") else ""
                      lines.append(
                          f"   🥂 <b>Ida 31/12 ➔ Volta {o['volta'][:5]}:</b> {brl(o['total_pix'])} ({st}){nota_11} — <a href=\"{o['url']}\">🔗 Abrir</a>"
                      )
                  lines.append("")
              send_telegram("\n".join(lines))
          PY

            if [ "$CICLO" -lt 2 ]; then
              sleep 300
            fi
          done

  # =========================================================================
  # MENSAGEM 3: ROTEIRO CASADO / CIDADES PRÓXIMAS (IDA POR UMA, VOLTA POR OUTRA)
  # =========================================================================
  mensagem_3_cidades_proximas:
    name: "Mensagem 3 - Roteiro 2 Cidades Proximas"
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar navegador do Playwright
        run: python -m playwright install --with-deps chromium

      - name: Preparar busca de trechos separados (Cidades Proximas)
        run: |
          python - <<'PY'
          import os
          import yaml

          os.makedirs("data", exist_ok=True)
          if os.path.exists("data/flight_prices.sqlite3"):
              os.remove("data/flight_prices.sqlite3")

          code = '''import re

          _orig_compile = re.compile
          _orig_findall = re.findall
          _orig_finditer = re.finditer

          _PIX_RE = _orig_compile(
              r"Total\\s+no\\s+Pix[^R\\d]{0,30}R\\$\\s*\\d[\\d\\.,]*",
              re.IGNORECASE
          )
          _TAG_RE = _orig_compile(r"<[^>]+>")

          def _filter_total_pix(text):
              if not isinstance(text, str):
                  return text
              if "total no pix" not in text.lower():
                  return text
              clean = _TAG_RE.sub(" ", text)
              matches = _PIX_RE.findall(clean)
              if matches:
                  return " | ".join(matches)
              return text

          class _PatternProxy:
              def __init__(self, pat):
                  self._pat = pat
              def findall(self, string, *args, **kwargs):
                  return self._pat.findall(_filter_total_pix(string), *args, **kwargs)
              def finditer(self, string, *args, **kwargs):
                  return self._pat.finditer(_filter_total_pix(string), *args, **kwargs)
              def search(self, string, *args, **kwargs):
                  return self._pat.search(_filter_total_pix(string), *args, **kwargs)
              def __getattr__(self, name):
                  return getattr(self._pat, name)

          def _compile_proxy(pattern, flags=0):
              pat = _orig_compile(pattern, flags)
              pat_str = pattern if isinstance(pattern, str) else ""
              if "R$" in pat_str or "R\\$" in pat_str or "\\d" in pat_str:
                  return _PatternProxy(pat)
              return pat

          def _findall_proxy(pattern, string, flags=0):
              return _orig_findall(pattern, _filter_total_pix(string), flags)

          def _finditer_proxy(pattern, string, flags=0):
              return _orig_finditer(pattern, _filter_total_pix(string), flags)

          re.compile = _compile_proxy
          re.findall = _findall_proxy
          re.finditer = _finditer_proxy
          '''
          with open("sitecustomize.py", "w", encoding="utf-8") as f:
              f.write(code)

          # Aeroportos que formam corredores turisticos proximos (incluindo Recife como apoio)
          airports = ["REC", "JPA", "NAT", "MCZ", "SSA", "IOS", "BPS"]
          idas = ["29-12-2026", "30-12-2026", "31-12-2026"]
          voltas = ["06-01-2027", "07-01-2027", "08-01-2027", "09-01-2027", "10-01-2027", "11-01-2027"]

          monitors = []
          # Trechos de IDA (Confins -> Destino)
          for iata in airports:
              for d in idas:
                  d_br = d.replace("-", "/")
                  monitors.append({
                      "name": f"IDA | {iata} | {d_br}",
                      "provider": "generic",
                      "enabled": True,
                      "url": f"https://123milhas.com/v2/busca?de=CNF&para={iata}&adultos=2&criancas=0&bebes=0&ida={d}&classe=3&is_loyalty=0",
                      "max_price_brl": 2500.00,
                      "min_drop_percent": 5,
                      "alert_on_any_change": False,
                      "alert_when_price_below_max": True,
                  })

          # Trechos de VOLTA (Destino -> Confins)
          for iata in airports:
              for d in voltas:
                  d_br = d.replace("-", "/")
                  monitors.append({
                      "name": f"VOLTA | {iata} | {d_br}",
                      "provider": "generic",
                      "enabled": True,
                      "url": f"https://123milhas.com/v2/busca?de={iata}&para=CNF&adultos=2&criancas=0&bebes=0&ida={d}&classe=3&is_loyalty=0",
                      "max_price_brl": 2500.00,
                      "min_drop_percent": 5,
                      "alert_on_any_change": False,
                      "alert_when_price_below_max": True,
                  })

          cfg = {
              "settings": {
                  "check_interval_minutes": 30,
                  "headless": True,
                  "browser_timeout_seconds": 60,
                  "alert_cooldown_minutes": 120,
                  "user_agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36",
                  "screenshot_on_error": False,
                  "notify_on_recovery": False,
              },
              "monitors": monitors,
          }
          with open("config.yaml", "w", encoding="utf-8") as f:
              yaml.safe_dump(cfg, f, allow_unicode=True, sort_keys=False)
          print(f"Configurados {len(monitors)} trechos individuais para cruzar cidades proximas.")
          PY

      - name: Cruzar Cidades Proximas e enviar 3a Mensagem no Telegram
        env:
          PYTHONPATH: "."
          SANDBOX_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          SANDBOX_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for CICLO in 1 2; do
            TELEGRAM_TOKEN="" TELEGRAM_CHAT_ID="" python -m app.main --once || true

            TELEGRAM_TOKEN="$SANDBOX_TELEGRAM_TOKEN" TELEGRAM_CHAT_ID="$SANDBOX_TELEGRAM_CHAT_ID" python - <<'PY'
          import os, sqlite3, urllib.parse, urllib.request, yaml
          from datetime import datetime, timezone, timedelta

          MAX_TOTAL_PIX_BRL = 2500.00

          def brl(value):
              return f"R$ {value:,.2f}".replace(",", "X").replace(".", ",").replace("X", ".")

          db_path = "data/flight_prices.sqlite3"
          if not os.path.exists(db_path):
              raise SystemExit(0)

          with open("config.yaml", "r", encoding="utf-8") as f:
              cfg = yaml.safe_load(f)

          active_monitors = {m["name"]: m["url"] for m in cfg.get("monitors", []) if m.get("enabled", True)}

          con = sqlite3.connect(db_path)
          con.row_factory = sqlite3.Row
          rows = con.execute("""
              SELECT monitor_name, checked_at, min_price_brl
              FROM price_checks
              WHERE id IN (SELECT MAX(id) FROM price_checks GROUP BY monitor_name)
          """).fetchall()

          idas_map = {}
          voltas_map = {}

          for row in rows:
              name = row["monitor_name"]
              if name in active_monitors and row["min_price_brl"] is not None:
                  price = float(row["min_price_brl"])
                  parts = [p.strip() for p in name.split("|")]
                  if len(parts) == 3:
                      tipo, iata, data_str = parts
                      entry = {"iata": iata, "date": data_str, "price": price, "url": active_monitors[name]}
                      if tipo == "IDA":
                          idas_map.setdefault(iata, []).append(entry)
                      elif tipo == "VOLTA":
                          voltas_map.setdefault(iata, []).append(entry)

          NAMES = {
              "REC": "Recife",
              "JPA": "João Pessoa",
              "NAT": "Natal",
              "MCZ": "Maceió",
              "SSA": "Salvador",
              "IOS": "Ilhéus",
              "BPS": "Porto Seguro",
          }

          # Pares de cidades proximas que valem a pena combinar na mesma viagem
          NEARBY_ROUTES = [
              ("REC", "JPA", "120 km (~1h30 BR-101) • Dá para curtir Litoral Sul/Pitimbu + João Pessoa"),
              ("JPA", "REC", "120 km (~1h30 BR-101) • Chega por João Pessoa e volta por Recife"),
              ("JPA", "NAT", "185 km (~2h15) • Roteiro João Pessoa + Praia da Pipa + Natal"),
              ("NAT", "JPA", "185 km (~2h15) • Roteiro Natal + Praia da Pipa + João Pessoa"),
              ("REC", "MCZ", "255 km (~3h15) • Rota Ecológica: Porto de Galinhas + Maragogi + Milagres + Maceió"),
              ("MCZ", "REC", "255 km (~3h15) • Rota Ecológica: Maceió + Milagres + Maragogi + volta por Recife"),
              ("REC", "NAT", "290 km (~3h30) • Roteiro passando por João Pessoa e Pipa até Natal"),
              ("NAT", "REC", "290 km (~3h30) • Roteiro descendo de Natal e Pipa até Recife"),
              ("SSA", "IOS", "Rota das Ilhas e Cacau • Salvador + Morro de São Paulo + Boipeba + Itacaré + Ilhéus"),
              ("IOS", "SSA", "Rota do Cacau e Ilhas • Chega em Ilhéus/Itacaré + Morro de São Paulo + volta por Salvador"),
              ("IOS", "BPS", "300 km • Costa do Cacau e Descobrimento (Ilhéus + Arraial d'Ajuda/Trancoso + Porto Seguro)"),
              ("BPS", "IOS", "300 km • Chega em Porto Seguro/Trancoso e sobe até Ilhéus/Itacaré"),
          ]

          combos = []
          for ida_iata, volta_iata, desc in NEARBY_ROUTES:
              if ida_iata in idas_map and volta_iata in voltas_map:
                  for o in idas_map[ida_iata]:
                      for r in voltas_map[volta_iata]:
                          total = o["price"] + r["price"]
                          combos.append({
                              "pair_key": f"{ida_iata}->{volta_iata}",
                              "title": f"Ida por {NAMES[ida_iata]} ({ida_iata}) ➔ Volta por {NAMES[volta_iata]} ({volta_iata})",
                              "desc": desc,
                              "ida_date": o["date"],
                              "volta_date": r["date"],
                              "ida_price": o["price"],
                              "volta_price": r["price"],
                              "total_pix": total,
                              "ida_url": o["url"],
                              "volta_url": r["url"],
                          })

          token = os.environ.get("TELEGRAM_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat_id or not combos:
              raise SystemExit(0)

          url_api = f"https://api.telegram.org/bot{token}/sendMessage"

          def send_telegram(msg_html):
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id, "text": msg_html, "parse_mode": "HTML", "disable_web_page_preview": "true"
              }).encode("utf-8")
              req = urllib.request.Request(url_api, data=payload, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  response.read()

          now_br = datetime.now(timezone(timedelta(hours=-3))).strftime("%d/%m/%Y às %H:%M")

          # 1) Alerta de oportunidade se a soma (Ida Cidade A + Volta Cidade B) ficar ate R$ 2.500
          approved = [c for c in combos if c["total_pix"] <= MAX_TOTAL_PIX_BRL]
          if approved:
              approved.sort(key=lambda x: x["total_pix"])
              for c in approved[:4]:
                  card = "\n".join([
                      f"🗺️ <b>[3ª MENSAGEM - OFERTA 2 CIDADES] TOTAL PIX: {brl(c['total_pix'])}</b>",
                      f"📍 <b>{c['title']}</b>",
                      f"🚗 <i>{c['desc']}</i>",
                      "",
                      f"🛫 <b>Ida ({c['ida_date']}):</b> {brl(c['ida_price'])} — <a href=\"{c['ida_url']}\">🔗 Abrir Ida</a>",
                      f"🛬 <b>Volta ({c['volta_date']}):</b> {brl(c['volta_price'])} — <a href=\"{c['volta_url']}\">🔗 Abrir Volta</a>",
                      f"🕒 <b>Verificado em:</b> {now_br}",
                  ])
                  send_telegram(card)

          # 2) Ranking com a melhor combinacao de cada rota de cidades vizinhas
          best_per_route = {}
          for c in combos:
              k = c["pair_key"]
              if k not in best_per_route or c["total_pix"] < best_per_route[k]["total_pix"]:
                  best_per_route[k] = c

          sorted_routes = sorted(best_per_route.values(), key=lambda x: x["total_pix"])

          lines = [
              f"🗺️ <b>[3ª MENSAGEM] ROTEIRO 2 CIDADES PRÓXIMAS ({now_br})</b>",
              "💡 <i>Chegando por um aeroporto e voltando por outro próximo (Total Pix p/ 2 adultos c/ taxas)</i>",
              f"🎯 <i>Meta combinada (Ida + Volta): até {brl(MAX_TOTAL_PIX_BRL)}</i>",
              ""
          ]

          for i, c in enumerate(sorted_routes[:8], 1):
              st = "✅ <b>DENTRO DO TETO!</b>" if c["total_pix"] <= MAX_TOTAL_PIX_BRL else "⏳ Acima"
              lines.extend([
                  f"{i}º 💰 <b>Total Combinado: {brl(c['total_pix'])}</b> ({st})",
                  f"   📍 <b>{c['title']}</b>",
                  f"   🚗 <i>{c['desc']}</i>",
                  f"   🛫 Ida {c['ida_date'][:5]} ({brl(c['ida_price'])}) <a href=\"{c['ida_url']}\">🔗 Link Ida</a> | 🛬 Volta {c['volta_date'][:5]} ({brl(c['volta_price'])}) <a href=\"{c['volta_url']}\">🔗 Link Volta</a>",
                  ""
              ])

          send_telegram("\n".join(lines))
          PY

            if [ "$CICLO" -lt 2 ]; then
              sleep 300
            fi
          done
